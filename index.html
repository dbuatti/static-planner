<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Today">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F3EE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<title>Today</title>
<style>
.date-hero { margin: 4px 2px 16px; }
.date-hero .dow { font-family: "Young Serif", Georgia, serif; font-size: 30px; line-height: 1.1; }
.date-hero .sub { color: var(--soft); font-size: 15px; margin-top: 2px; }

.sched-list { display: flex; flex-direction: column; }
.sched-row { display: flex; align-items: baseline; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
.sched-row:last-child { border-bottom: none; }
.sched-row .tm { font-size: 12px; color: var(--soft); white-space: nowrap; min-width: 74px; font-variant-numeric: tabular-nums; }
.sched-row .tx { font-size: 14.5px; }
.sched-row.is-meal .tx, .sched-row.is-free .tx { color: var(--soft); }
.empty { color: var(--soft); font-size: 14px; padding: 6px 0; }

.prac-today { display: flex; align-items: center; gap: 14px; }
.prac-today .meta { flex: 1; min-width: 0; }
.prac-today .meta .streak { font-weight: 700; font-size: 15px; }
.prac-today .meta .sub { font-size: 12.5px; color: var(--soft); margin-top: 2px; }

.prac-ticks-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.prac-ticks-row .pt { width: 100%; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.prac-ticks-row .pt svg { width: 20px; height: 20px; }
.prac-ticks-row .pt .pt-lb { font-size: 10.5px; color: var(--soft); line-height: 1.1; }
.prac-ticks-row .pt[aria-pressed="true"] .pt-lb { color: var(--bg); }

.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.quick button {
  border: 1.5px solid var(--rule);
  background: var(--card);
  border-radius: 14px;
  padding: 12px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  min-height: 84px;
}
.quick button:active { background: var(--tap); }
.quick .q-ic { font-size: 24px; line-height: 1; }
.quick .q-lb { font-size: 12px; color: var(--soft); }
.quick .q-n { font-size: 18px; font-weight: 700; }
.left-line { text-align: center; font-size: 14px; color: var(--soft); margin-top: 12px; }
.left-line strong { color: var(--ink); font-weight: 700; }

.home-links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.home-links a {
  display: flex; align-items: center; gap: 10px;
  border: 1px solid var(--rule); border-radius: 14px;
  padding: 14px; text-decoration: none; color: var(--ink); background: var(--card);
}
.home-links a:active { background: var(--tap); }
.home-links .ic { font-size: 22px; }
.home-links .lb { font-weight: 600; font-size: 14px; }
</style>
</head>
<body>

<div class="wrap">

  <div class="date-hero">
    <div class="dow" id="today-dow">Today</div>
    <div class="sub" id="today-sub"></div>
  </div>

  <div class="card">
    <div class="card-head">
      <h2>Schedule</h2>
      <a href="plan.html" class="amt" style="text-decoration:none;">Open plan →</a>
    </div>
    <div class="sched-list" id="sched-list"></div>
  </div>

  <div class="card">
    <div class="card-head"><h2>Practice</h2><a href="practice.html" class="amt" style="text-decoration:none;">Practice →</a></div>
    <div class="prac-ticks-row" id="prac-ticks"></div>
    <div class="prac-today">
      <div class="meta">
        <div class="streak" id="prac-streak"></div>
        <div class="sub" id="prac-sub"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h2>Today's tasks</h2><a href="plan.html" class="amt" style="text-decoration:none;">Plan →</a></div>
    <div id="top-tasks"></div>
  </div>

  <div class="card">
    <div class="card-head"><h2>Spending</h2><a href="spending.html" class="amt" style="text-decoration:none;">Spending →</a></div>
    <div class="quick">
      <button id="q-cafe"><span class="q-ic">☕</span><span class="q-lb">Café</span><span class="q-n" id="q-cafe-n">0</span></button>
      <button id="q-home"><span class="q-ic">🏠</span><span class="q-lb">Home coffee</span><span class="q-n" id="q-home-n">0</span></button>
      <button id="q-meal"><span class="q-ic">🍽</span><span class="q-lb">Meal out</span><span class="q-n" id="q-meal-n">0</span></button>
    </div>
    <p class="left-line" id="left-line"></p>
  </div>

  <div class="card">
    <div class="card-head"><h2>Go to</h2></div>
    <div class="home-links">
      <a href="plan.html"><span class="ic">📋</span><span class="lb">Plan</span></a>
      <a href="practice.html"><span class="ic">🧘</span><span class="lb">Practice</span></a>
      <a href="spending.html"><span class="ic">💰</span><span class="lb">Spending</span></a>
      <a href="more.html"><span class="ic">⚙</span><span class="lb">Settings</span></a>
    </div>
  </div>

</div>

<script src="assets/js/store.js"></script>
<script src="assets/js/helpers.js"></script>
<script src="assets/js/practice.js"></script>
<script src="assets/js/spending.js"></script>
<script src="data/schedule.js"></script>
<script src="assets/js/nav.js"></script>
<script>
(function () {
  "use strict";

  var SIT = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6a2 2 0 1 0 0-.01M6 18c2-3 4-4 6-4s4 1 6 4M4 20h16"/></svg>';
  var KEYS = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="1.5"/><path d="M9.3 5v14M14.7 5v14M8 5v8h2.6V5M13.4 5v8H16V5"/></svg>';

  function toMin(s) { var p = s.split(":"); return parseInt(p[0]) * 60 + parseInt(p[1]); }
  function timeRange(t) { var p = t.trim().split(/[–\-]/); return { start: p[0].trim(), end: p.length > 1 ? p[1].trim() : p[0].trim() }; }

  var todayISO = Helpers.melbNowISO();
  var wd = Helpers.melbWeekday();
  var wdNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var monday = Helpers.mondayISO(todayISO);
  var dayIdx = (wd + 6) % 7;

  // Date hero
  document.getElementById("today-dow").textContent = wdNames[wd];
  document.getElementById("today-sub").textContent =
    new Date(todayISO + "T00:00:00").toLocaleDateString("en-AU", { day: "numeric", month: "long", year: "numeric" });

  // Migrate legacy tracker data if present
  Practice.migrate();
  Spending.migrate();

  function todayDay() {
    for (var i = 0; i < DAYS.length; i++) if (DAYS[i].dateISO === todayISO) return DAYS[i];
    return null;
  }

  // ---- Schedule ----
  function renderSchedule() {
    var host = document.getElementById("sched-list");
    var day = todayDay();
    if (!day || !day.events || !day.events.length) {
      host.innerHTML = '<p class="empty">Nothing scheduled today.</p>';
      return;
    }
    var html = "";
    day.events.forEach(function (e) {
      var meal = /Lunch|Dinner|Breakfast|Meal/i.test(e.text);
      var free = /FREE DAY|DAY OFF|SYDNEY|FREE|day off/i.test(e.text);
      var cls = meal ? "is-meal" : (free ? "is-free" : "");
      html += '<div class="sched-row ' + cls + '"><span class="tm">' + (e.time || "") + '</span><span class="tx">' + (e.text || "") + '</span></div>';
    });
    host.innerHTML = html;
  }

  // ---- Top 3 tasks ----
  function tickableTasks(day) {
    var evs = (day.events || []).slice().sort(function (a, b) {
      return toMin(timeRange(a.time).start) - toMin(timeRange(b.time).start);
    });
    var out = [];
    var n = 0;
    evs.forEach(function (e) {
      var meal = /Lunch|Dinner|Breakfast|Meal/i.test(e.text);
      if (e.tickable === false || meal) return;
      out.push({ ev: e, tickId: day.id + "-t" + (e.tid !== undefined ? e.tid : n++) });
    });
    return out;
  }

  // Ticks live in the planner.tasks namespace so backup/import/reset cover them,
  // and are mirrored to the legacy tick-<id> keys plan.html still reads.
  function taskData() { return Store.get("tasks", { ticks: {} }); }

  function tickState(tickId) {
    var v = taskData().ticks[tickId];
    if (v !== undefined) return v;
    try { return localStorage.getItem("tick-" + tickId); } catch (e) { return null; }
  }

  function setTick(tickId, on) {
    var d = taskData();
    if (!d.ticks || typeof d.ticks !== "object") d.ticks = {};
    if (on) d.ticks[tickId] = "1"; else delete d.ticks[tickId];
    Store.set("tasks", d);
    try { if (on) localStorage.setItem("tick-" + tickId, "1"); else localStorage.removeItem("tick-" + tickId); } catch (e) {}
  }

  function syncTick(day, ev, done) {
    try {
      var startMin = toMin(timeRange(ev.time).start);
      fetch("https://planner-api.daniele-buatti.workers.dev/tasks/done", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ day: day.dateISO, startMin: startMin, done: done })
      }).catch(function () {});
    } catch (e) {}
  }

  function renderTasks() {
    var host = document.getElementById("top-tasks");
    var day = todayDay();
    if (!day) { host.innerHTML = '<p class="empty">Nothing scheduled today.</p>'; return; }
    var tasks = tickableTasks(day).filter(function (t) {
      return t.ev.done !== true && tickState(t.tickId) !== "1";
    }).slice(0, 3);
    if (!tasks.length) { host.innerHTML = '<p class="empty">All done for today.</p>'; return; }
    var html = "";
    tasks.forEach(function (t) {
      html += '<div class="task-row" data-tickid="' + t.tickId + '">'
        + '<span class="check">✓</span>'
        + '<span style="flex:1"><span class="task-time">' + (t.ev.time || "") + '</span><br><span class="task-text">' + (t.ev.text || "") + '</span></span>'
        + '</div>';
    });
    host.innerHTML = html;
    Array.prototype.forEach.call(host.children, function (row) {
      row.addEventListener("click", function () {
        var tickId = row.getAttribute("data-tickid");
        var tasksAll = tickableTasks(todayDay());
        var t = null;
        for (var i = 0; i < tasksAll.length; i++) if (tasksAll[i].tickId === tickId) { t = tasksAll[i]; break; }
        var done = !row.classList.contains("ticked");
        row.classList.toggle("ticked", done);
        setTick(tickId, done);
        if (t) syncTick(todayDay(), t.ev, done);
        setTimeout(renderTasks, 350);
      });
    });
  }

  // ---- Practice ----
  var FREE_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M10 9.2l5 2.8-5 2.8z"/></svg>';
  var MUS_NOTE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>';

  function renderPractice() {
    var host = document.getElementById("prac-ticks");
    var w = Practice.getWeek(monday);
    var parts = [
      { kind: "sit", on: !!w.sit[dayIdx], ic: SIT, lb: "Sit" },
      { kind: "tech", on: !!w.tech[dayIdx], ic: MUS_NOTE, lb: "Technique" },
      { kind: "piece", on: !!w.piece[dayIdx], ic: KEYS, lb: "Stretch piece" },
      { kind: "free", on: !!w.free[dayIdx], ic: FREE_PLAY, lb: "Free play" }
    ];
    host.innerHTML = parts.map(function (p) {
      return '<button class="pt pno" data-t="' + p.kind + '" aria-pressed="' + p.on + '" aria-label="' + p.lb + '">'
        + p.ic + '<span class="pt-lb">' + p.lb + '</span></button>';
    }).join("");
    Array.prototype.forEach.call(host.querySelectorAll(".pt"), function (b) {
      b.addEventListener("click", function () { Practice.toggle(dayIdx, b.dataset.t, monday); renderPractice(); });
    });

    var streak = Practice.streak();
    var done = Practice.weekDoneCount(monday);
    document.getElementById("prac-streak").textContent = (streak === 1 ? "1 day streak" : streak + " day streak");
    document.getElementById("prac-sub").textContent = done + " of 7 days this week · technique 15 · stretch 15 · free play 10";
  }

  // ---- Spending quick taps ----
  function renderSpending() {
    var data = Spending.getData();
    var w = Spending.week(monday);
    var s = Spending.spent(w, data.plan);
    var pt = Spending.planTotal(data.plan);
    var left = pt - s.total;

    document.getElementById("q-cafe-n").textContent = w.cafe || 0;
    document.getElementById("q-home-n").textContent = w.home || 0;
    document.getElementById("q-meal-n").textContent = w.meal || 0;

    var leftEl = document.getElementById("left-line");
    leftEl.innerHTML = left >= 0
      ? "<strong>" + Helpers.money0(left) + "</strong> left this week"
      : "<strong>" + Helpers.money0(-left) + "</strong> over this week";
  }

  function bump(key) {
    var w = Spending.week(monday);
    w[key] = (w[key] || 0) + 1;
    Spending.setWeek(monday, w);
    renderSpending();
  }

  document.getElementById("q-cafe").addEventListener("click", function () { bump("cafe"); });
  document.getElementById("q-home").addEventListener("click", function () { bump("home"); });
  document.getElementById("q-meal").addEventListener("click", function () { bump("meal"); });

  renderSchedule();
  renderTasks();
  renderPractice();
  renderSpending();
  window.addEventListener("planner:spending-restore", renderSpending);
})();
</script>
</body>
</html>
